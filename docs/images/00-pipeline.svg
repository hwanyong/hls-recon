<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 706" role="img"
     aria-label="스트림을 파일로 되돌리는 12단계 파이프라인. 1~4단계는 무엇을 받을지 정하고, 5~8단계는 받은 것이 옳은지 검사하며, 9~12단계는 만든 것이 옳은지 검증한다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .grp   { fill:#f6f8fa; stroke:#d8dee6 }
    .cap   { fill:#eaeef2 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .good  { fill:#1a7f37 }
    .pillG { fill:#dafbe1 }
    .num   { fill:#0969da }
    .mk    { fill:#8c959f }
    .arw   { stroke:#8c959f }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .grp   { fill:#161b22; stroke:#30363d }
      .cap   { fill:#21262d }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .good  { fill:#3fb950 }
      .pillG { fill:#12341f }
      .num   { fill:#4493f8 }
      .mk    { fill:#6e7681 }
      .arw   { stroke:#6e7681 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
  </defs>

  <rect class="bg" x="20" y="14" width="840" height="678" rx="10" stroke-width="1"/>

  <rect class="cap" x="300" y="32" width="280" height="30" rx="15"/>
  <text class="ink" x="440" y="52" font-size="12.5" text-anchor="middle">사용자가 가진 것 — 웹페이지 주소 하나</text>
  <line x1="440" y1="64" x2="440" y2="82" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>

  <text class="acc" x="44" y="100" font-size="12" font-weight="600">무엇을 받을지 정한다</text>
  <rect class="grp" x="44" y="108" width="792" height="146" rx="8" stroke-width="1"/>
  <text class="num m" x="66" y="136" font-size="12" font-weight="600">[1]</text>
  <text class="ink" x="102" y="136" font-size="12.5">주소 획득</text>
  <text class="muted" x="272" y="136" font-size="12">시리즈 페이지 → 회차 → 플레이어 iframe → XHR → 서명된 m3u8</text>
  <text class="acc m" x="748" y="136" font-size="11.5">series.py</text>
  <text class="num m" x="66" y="166" font-size="12" font-weight="600">[2]</text>
  <text class="ink" x="102" y="166" font-size="12.5">매니페스트 수신</text>
  <text class="muted" x="272" y="166" font-size="12">HTTP GET · 압축 해제 · 인코딩 판정</text>
  <text class="acc m" x="748" y="166" font-size="11.5">fetch.py</text>
  <text class="num m" x="66" y="196" font-size="12" font-weight="600">[3]</text>
  <text class="ink" x="102" y="196" font-size="12.5">매니페스트 파싱</text>
  <text class="muted" x="272" y="196" font-size="12">M3U8 텍스트 → Playlist 자료구조</text>
  <text class="acc m" x="748" y="196" font-size="11.5">playlist.py</text>
  <text class="num m" x="66" y="226" font-size="12" font-weight="600">[4]</text>
  <text class="ink" x="102" y="226" font-size="12.5">후보 선택</text>
  <text class="muted" x="272" y="226" font-size="12">ABR 래더에서 화질 하나 고르기</text>
  <text class="acc m" x="748" y="226" font-size="11.5">playlist.py</text>

  <line x1="440" y1="256" x2="440" y2="276" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>

  <text class="acc" x="44" y="296" font-size="12" font-weight="600">받은 것이 옳은가</text>
  <rect class="grp" x="44" y="304" width="792" height="146" rx="8" stroke-width="1"/>
  <text class="num m" x="66" y="332" font-size="12" font-weight="600">[5]</text>
  <text class="ink" x="102" y="332" font-size="12.5">세그먼트 수신</text>
  <text class="muted" x="272" y="332" font-size="12">병렬 HTTP · 재시도 · TTFB 계측 · SHA-256</text>
  <text class="acc m" x="748" y="332" font-size="11.5">fetch.py</text>
  <text class="num m" x="66" y="362" font-size="12" font-weight="600">[6]</text>
  <text class="ink" x="102" y="362" font-size="12.5">복호화</text>
  <text class="muted" x="272" y="362" font-size="12">AES-128-CBC · IV 유도 · PKCS#7 패딩 제거</text>
  <text class="acc m" x="748" y="362" font-size="11.5">decrypt.py</text>
  <text class="num m" x="66" y="392" font-size="12" font-weight="600">[7]</text>
  <text class="ink" x="102" y="392" font-size="12.5">페이로드 판별</text>
  <text class="muted" x="272" y="392" font-size="12">선두 바이트로 컨테이너 식별 — 헤더를 믿지 않는다</text>
  <text class="acc m" x="740" y="392" font-size="11.5">tsanalyze.py</text>
  <text class="num m" x="66" y="422" font-size="12" font-weight="600">[8]</text>
  <text class="ink" x="102" y="422" font-size="12.5">전송 무결성 검사</text>
  <text class="muted" x="272" y="422" font-size="12">TS 패킷 순회 · continuity counter 점프 검출</text>
  <text class="acc m" x="740" y="422" font-size="11.5">tsanalyze.py</text>

  <line x1="440" y1="452" x2="440" y2="472" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>

  <text class="acc" x="44" y="492" font-size="12" font-weight="600">만든 것이 옳은가</text>
  <rect class="grp" x="44" y="500" width="792" height="146" rx="8" stroke-width="1"/>
  <text class="num m" x="60" y="528" font-size="12" font-weight="600">[9]</text>
  <text class="ink" x="102" y="528" font-size="12.5">연결·먹싱</text>
  <text class="muted" x="272" y="528" font-size="12">바이트 연결 → 컨테이너 변환 (재인코딩 없음)</text>
  <text class="acc m" x="742" y="528" font-size="11.5">assemble.py</text>
  <text class="num m" x="56" y="558" font-size="12" font-weight="600">[10]</text>
  <text class="ink" x="102" y="558" font-size="12.5">부가 트랙</text>
  <text class="muted" x="272" y="558" font-size="12">자막 추출 · 시간축 정렬 · 경계 중복 제거</text>
  <text class="acc m" x="740" y="558" font-size="11.5">subtitles.py</text>
  <text class="num m" x="56" y="588" font-size="12" font-weight="600">[11]</text>
  <text class="ink" x="102" y="588" font-size="12.5">산출물 실측</text>
  <text class="muted" x="272" y="588" font-size="12">ffprobe · PTS 갭 스캔 · 전체 디코드</text>
  <text class="acc m" x="754" y="588" font-size="11.5">probe.py</text>
  <text class="num m" x="56" y="618" font-size="12" font-weight="600">[12]</text>
  <text class="ink" x="102" y="618" font-size="12.5">판정·보고</text>
  <text class="muted" x="272" y="618" font-size="12">임계값 적용 → PASS / WARN / FAIL</text>
  <text class="acc m" x="750" y="618" font-size="11.5">report.py</text>

  <line x1="440" y1="648" x2="440" y2="662" class="arw" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect class="pillG" x="276" y="664" width="328" height="30" rx="15"/>
  <text class="good" x="440" y="684" font-size="12.5" text-anchor="middle" font-weight="600">파일 하나 + 판정 하나 + 종료 코드 (0 또는 2)</text>
</svg>

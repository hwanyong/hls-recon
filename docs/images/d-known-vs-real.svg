<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" role="img"
     aria-label="세 겹의 영역 그림. 가장 안쪽은 README 의 알려진 한계 11항목, 그 바깥은 교재 39개 장의 한계와 미해결 절에 적힌 283항목, 가장 바깥은 아직 이름이 붙지 않아 크기를 알 수 없는 영역이며 경계가 점선으로 열려 있다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .open  { fill:#f6f8fa; stroke:#8c959f }
    .mid   { fill:#ddf4ff; stroke:#54aeff }
    .core  { fill:#dafbe1; stroke:#4ac26b }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .good  { fill:#1a7f37 }
    .warn  { fill:#9a6700 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .open  { fill:#161b22; stroke:#6e7681 }
      .mid   { fill:#121d2f; stroke:#316dca }
      .core  { fill:#0f2916; stroke:#2ea043 }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .good  { fill:#3fb950 }
      .warn  { fill:#d29922 }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="14" width="840" height="344" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">알려진 한계 · 적어 둔 한계 · 아직 이름이 없는 것</text>

  <rect class="open" x="52" y="60" width="776" height="236" rx="10" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text class="muted" x="72" y="86" font-size="12.5" font-weight="600">아직 이름이 붙지 않은 것 — 크기를 모른다 (경계가 열려 있다)</text>

  <rect class="mid" x="112" y="102" width="656" height="176" rx="9" stroke-width="1.3"/>
  <text x="132" y="128" font-size="12.5" xml:space="preserve"><tspan class="acc" font-weight="600">교재 39개 장의 「한계와 미해결」 — 283항목</tspan><tspan class="muted"> · 이 부록이 통합한 범위</tspan></text>

  <rect class="core" x="196" y="150" width="488" height="106" rx="8" stroke-width="1.3"/>
  <text class="good" x="440" y="184" font-size="13.5" font-weight="600" text-anchor="middle">README 「알려진 한계」 — 11항목</text>
  <text class="muted m" x="440" y="208" font-size="11" text-anchor="middle">README.md:409-441</text>
  <text class="muted" x="440" y="234" font-size="11.5" text-anchor="middle">여섯 출처를 모두 건드리지만 검증 경로의 미탐은 거의 빠져 있다</text>

  <text class="warn" x="44" y="330" font-size="12.5" xml:space="preserve"><tspan font-weight="600">한계 목록은 그 자체로 불완전하다.</tspan><tspan class="muted"> 바깥 영역의 크기는 이 저장소의 어떤 검사로도 관측되지 않는다.</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img"
     aria-label="정상 송출과 위장 송출의 차이. 플레이리스트의 확장자와 응답 헤더의 Content-Type 만 바뀌고 본문 선두 바이트는 그대로 MPEG-TS 다.">
  <style>
    .bg    { fill:#ffffff; stroke:#d8dee6 }
    .row   { fill:#f6f8fa }
    .keep  { fill:#dafbe1 }
    .ink   { fill:#1f2328 }
    .muted { fill:#656d76 }
    .acc   { fill:#0969da }
    .bad   { fill:#cf222e }
    .good  { fill:#1a7f37 }
    .rule  { stroke:#d8dee6 }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#0d1117; stroke:#30363d }
      .row   { fill:#161b22 }
      .keep  { fill:#12341f }
      .ink   { fill:#e6edf3 }
      .muted { fill:#8b949e }
      .acc   { fill:#4493f8 }
      .bad   { fill:#f85149 }
      .good  { fill:#3fb950 }
      .rule  { stroke:#30363d }
    }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif }
    .m   { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
  </style>

  <rect class="bg" x="20" y="14" width="840" height="302" rx="10" stroke-width="1"/>
  <text class="ink" x="44" y="44" font-size="15" font-weight="600">위장이 바꾸는 것과 바꾸지 못하는 것</text>

  <text class="muted" x="210" y="72" font-size="12.5" font-weight="600">정상 송출</text>
  <text class="bad" x="500" y="72" font-size="12.5" font-weight="600">위장 송출</text>
  <line class="rule" x1="44" y1="80" x2="836" y2="80" stroke-width="1"/>

  <rect class="row" x="44" y="88" width="792" height="52" rx="6"/>
  <text class="ink" x="62" y="112" font-size="12.5">플레이리스트 줄</text>
  <text class="muted m" x="62" y="130" font-size="11">#EXTINF:6.006,</text>
  <text class="muted m" x="210" y="120" font-size="12.5">1080p_010.ts</text>
  <text class="bad m" x="500" y="120" font-size="12.5" font-weight="600">1080p_010.html</text>
  <text class="bad" x="690" y="120" font-size="12" font-weight="600">확장자만 바뀜</text>

  <rect class="row" x="44" y="148" width="792" height="52" rx="6"/>
  <text class="ink" x="62" y="172" font-size="12.5">응답 헤더</text>
  <text class="muted" x="62" y="190" font-size="11">서버가 선언한 타입</text>
  <text class="muted m" x="210" y="180" font-size="12">Content-Type: video/mp2t</text>
  <text class="bad m" x="500" y="180" font-size="12" font-weight="600">Content-Type: text/html</text>
  <text class="bad" x="690" y="180" font-size="12" font-weight="600">선언만 바뀜</text>

  <rect class="keep" x="44" y="208" width="792" height="52" rx="6"/>
  <text class="ink" x="62" y="232" font-size="12.5" font-weight="600">본문 선두 4바이트</text>
  <text class="muted" x="62" y="250" font-size="11">실제 데이터</text>
  <text class="good m" x="210" y="240" font-size="12.5" font-weight="600">47 40 11 10</text>
  <text class="good m" x="500" y="240" font-size="12.5" font-weight="600">47 40 11 10</text>
  <text class="good" x="690" y="240" font-size="12" font-weight="600">그대로</text>

  <text x="44" y="288" font-size="12.5" xml:space="preserve"><tspan class="muted">위장 송출도 이 값은 바꿀 수 없다 — </tspan><tspan class="ink" font-weight="600">바꾸면 그 순간 재생이 되지 않기 때문이다.</tspan><tspan class="muted"> 그래서 판별의 근거가 된다.</tspan></text>
</svg>
